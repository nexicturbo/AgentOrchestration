services:
  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
      target: scheduler
    environment:
      AO_SCHEDULER_HEALTH_STORAGE_DIR: /tmp/ao-scheduler-health
    healthcheck:
      test: ["CMD", "python", "-m", "src.orchestrator.scheduler_health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    depends_on:
      scheduler:
        condition: service_healthy
